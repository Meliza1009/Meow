<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="920" viewBox="0 0 1100 920" role="img" aria-labelledby="title desc"><title id="title">PHYSICAL ZIP workflow</title><desc id="desc">Enter, enable camera, calibrate, compress, view results, and extract. Camera processing happens in the browser.</desc><rect width="1100" height="920" fill="#171a18"/><g font-family="Arial, sans-serif"><text x="60" y="70" fill="#f2c94c" font-size="32" font-weight="bold">PHYSICAL ZIP / WORKFLOW</text><rect x="60" y="110" width="980" height="86" rx="8" fill="#282d27" stroke="#525b4b"/><text x="84" y="142" fill="#f2c94c" font-size="20" font-weight="bold">01 / ENTER</text><text x="84" y="172" fill="#f0f3e9" font-size="21">Try the illustrated demo, then enter the game.</text><path d="M550 200 v16 m-6 -6 l6 6 6 -6" fill="none" stroke="#f2c94c" stroke-width="2"/><rect x="60" y="222" width="980" height="86" rx="8" fill="#282d27" stroke="#525b4b"/><text x="84" y="254" fill="#f2c94c" font-size="20" font-weight="bold">02 / CAMERA</text><text x="84" y="284" fill="#f0f3e9" font-size="21">Grant camera access; load MediaPipe models.</text><path d="M550 312 v16 m-6 -6 l6 6 6 -6" fill="none" stroke="#f2c94c" stroke-width="2"/><rect x="60" y="334" width="980" height="86" rx="8" fill="#282d27" stroke="#525b4b"/><text x="84" y="366" fill="#f2c94c" font-size="20" font-weight="bold">03 / CALIBRATE</text><text x="84" y="396" fill="#f0f3e9" font-size="21">Capture a baseline pose and silhouette.</text><path d="M550 424 v16 m-6 -6 l6 6 6 -6" fill="none" stroke="#f2c94c" stroke-width="2"/><rect x="60" y="446" width="980" height="86" rx="8" fill="#282d27" stroke="#525b4b"/><text x="84" y="478" fill="#f2c94c" font-size="20" font-weight="bold">04 / COMPRESS</text><text x="84" y="508" fill="#f0f3e9" font-size="21">Follow pose cues; fold, shrink and hold.</text><path d="M550 536 v16 m-6 -6 l6 6 6 -6" fill="none" stroke="#f2c94c" stroke-width="2"/><rect x="60" y="558" width="980" height="86" rx="8" fill="#282d27" stroke="#525b4b"/><text x="84" y="590" fill="#f2c94c" font-size="20" font-weight="bold">05 / RESULT</text><text x="84" y="620" fill="#f0f3e9" font-size="21">Save a local score; download or share a result.</text><path d="M550 648 v16 m-6 -6 l6 6 6 -6" fill="none" stroke="#f2c94c" stroke-width="2"/><rect x="60" y="670" width="980" height="86" rx="8" fill="#282d27" stroke="#525b4b"/><text x="84" y="702" fill="#f2c94c" font-size="20" font-weight="bold">06 / EXTRACT</text><text x="84" y="732" fill="#f0f3e9" font-size="21">Match the original pose to restore your human.</text><text x="60" y="826" fill="#f0f3e9" font-size="20">Camera frames → browser vision engine → pose + silhouette scoring</text><text x="60" y="862" fill="#bac3b4" font-size="18">Models download from Google. Scores stay in localStorage. Sharing is user initiated.</text></g></svg>